version: '3.8'

services:
  # ClusterFuzzLite builder service
  builder:
    build:
      context: ../..
      dockerfile: fuzz/clusterfuzzlite/Dockerfile
    volumes:
      - ../../:/workspace
      - ./corpus:/workspace/fuzz/clusterfuzzlite/corpus
      - ./crashes:/workspace/fuzz/clusterfuzzlite/crashes
      - ./coverage:/workspace/fuzz/clusterfuzzlite/coverage
      - ./logs:/workspace/fuzz/clusterfuzzlite/logs
    working_dir: /workspace/fuzz/clusterfuzzlite
    environment:
      - HOME=/tmp
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    profiles:
      - build

  # ClusterFuzzLite fuzzer service
  fuzzer:
    build:
      context: ../..
      dockerfile: fuzz/clusterfuzzlite/Dockerfile
    volumes:
      - ../../:/workspace
      - ./corpus:/workspace/fuzz/clusterfuzzlite/corpus
      - ./crashes:/workspace/fuzz/clusterfuzzlite/crashes
      - ./coverage:/workspace/fuzz/clusterfuzzlite/coverage
      - ./logs:/workspace/fuzz/clusterfuzzlite/logs
    working_dir: /workspace/fuzz/clusterfuzzlite
    environment:
      - HOME=/tmp
      - FUZZ_SECONDS=3600
      - MODE=batch
      - SANITIZER=address
      - LANGUAGE=c++
      - PARALLEL_FUZZING=true
      - LOW_DISK_SPACE=true
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    command: ["./run_clusterfuzz.sh"]

  # Simple local runner (uses existing build, wraps with CF Lite)
  clusterfuzz-local:
    build:
      context: ../..
      dockerfile: fuzz/dockerfile
    volumes:
      - ../../:/workspace
      - ./:/workspace/fuzz/clusterfuzzlite
    working_dir: /workspace/fuzz/clusterfuzzlite
    environment:
      - HOME=/tmp
      - ASAN_OPTIONS=detect_leaks=0
      - FUZZ_SECONDS=120
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    command: ["./run_clusterfuzz.sh"]
